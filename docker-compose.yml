name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}-postgres16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - ${PROJECT_ROOT:-.}/out/pgdata:/var/lib/postgresql/data
    restart: always
    ports:
      - ${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}-redis
    restart: always
    ports:
      - ${REDIS_HOST_PORT:?Set REDIS_HOST_PORT in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Set ASPNETCORE_ENVIRONMENT in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:?Set REDIS_CONNECT_TIMEOUT_MS in .env}
      REDIS_SYNC_TIMEOUT_MS: ${REDIS_SYNC_TIMEOUT_MS:?Set REDIS_SYNC_TIMEOUT_MS in .env}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER in .env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:?Set JWT_ACCESS_TOKEN_MINUTES in .env}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:?Set JWT_REFRESH_TOKEN_DAYS in .env}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:?Set REFRESH_COOKIE_NAME in .env}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:?Set REFRESH_COOKIE_SAME_SITE in .env}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:?Set REFRESH_COOKIE_SECURE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      PASSWORD_HASH_ITERATIONS: ${PASSWORD_HASH_ITERATIONS:?Set PASSWORD_HASH_ITERATIONS in .env}
      TOPICS_DEFAULT_PAGE_SIZE: ${TOPICS_DEFAULT_PAGE_SIZE:?Set TOPICS_DEFAULT_PAGE_SIZE in .env}
      TOPICS_MAX_PAGE_SIZE: ${TOPICS_MAX_PAGE_SIZE:?Set TOPICS_MAX_PAGE_SIZE in .env}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:?Set CACHE_TTL_SECONDS in .env}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:?Set CACHE_KEY_PREFIX in .env}
      VIEW_WINDOW_MINUTES: ${VIEW_WINDOW_MINUTES:?Set VIEW_WINDOW_MINUTES in .env}
      VIEW_FLUSH_INTERVAL_SECONDS: ${VIEW_FLUSH_INTERVAL_SECONDS:?Set VIEW_FLUSH_INTERVAL_SECONDS in .env}
      VIEW_SEEN_KEY_PREFIX: ${VIEW_SEEN_KEY_PREFIX:?Set VIEW_SEEN_KEY_PREFIX in .env}
      VIEW_COUNTER_KEY_PREFIX: ${VIEW_COUNTER_KEY_PREFIX:?Set VIEW_COUNTER_KEY_PREFIX in .env}
      VIEW_DIRTY_TOPICS_KEY: ${VIEW_DIRTY_TOPICS_KEY:?Set VIEW_DIRTY_TOPICS_KEY in .env}
      VISITOR_COOKIE_NAME: ${VISITOR_COOKIE_NAME:?Set VISITOR_COOKIE_NAME in .env}
      VISITOR_COOKIE_DAYS: ${VISITOR_COOKIE_DAYS:?Set VISITOR_COOKIE_DAYS in .env}
      VISITOR_COOKIE_SAME_SITE: ${VISITOR_COOKIE_SAME_SITE:?Set VISITOR_COOKIE_SAME_SITE in .env}
      VISITOR_COOKIE_SECURE: ${VISITOR_COOKIE_SECURE:?Set VISITOR_COOKIE_SECURE in .env}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:?Set RATE_LIMIT_KEY_PREFIX in .env}
      LOGIN_RATE_LIMIT_REQUESTS: ${LOGIN_RATE_LIMIT_REQUESTS:?Set LOGIN_RATE_LIMIT_REQUESTS in .env}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:?Set LOGIN_RATE_LIMIT_WINDOW_SECONDS in .env}
      CONTENT_RATE_LIMIT_REQUESTS: ${CONTENT_RATE_LIMIT_REQUESTS:?Set CONTENT_RATE_LIMIT_REQUESTS in .env}
      CONTENT_RATE_LIMIT_WINDOW_SECONDS: ${CONTENT_RATE_LIMIT_WINDOW_SECONDS:?Set CONTENT_RATE_LIMIT_WINDOW_SECONDS in .env}
      LOGGING__LOGLEVEL__DEFAULT: ${LOGGING__LOGLEVEL__DEFAULT:?Set LOGGING__LOGLEVEL__DEFAULT in .env}
      LOGGING__LOGLEVEL__MICROSOFT_ASPNETCORE: ${LOGGING__LOGLEVEL__MICROSOFT_ASPNETCORE:?Set LOGGING__LOGLEVEL__MICROSOFT_ASPNETCORE in .env}
    command:
      - >
        /tools/dotnet-ef migrations bundle
        --project src/Forum.Api/Forum.Api.csproj
        --startup-project src/Forum.Api/Forum.Api.csproj
        --output /tmp/efbundle --force
        && /tmp/efbundle
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["runtime"]
    container_name: web-forum-api-1
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      <<: *api-environment
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:?Set ASPNETCORE_URLS in .env}
    ports:
      - ${API_HOST_PORT:?Set API_HOST_PORT in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
